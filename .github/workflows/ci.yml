name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync environment (from uv.lock)
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/ -q
